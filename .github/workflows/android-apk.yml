# Builds the Android app (android/) on every push that touches it, or from
# Actions > Android APK > Run workflow. The APK is published on the public
# "apk-latest" release, so anyone can download it without signing in:
#   https://github.com/<owner>/shipment-checker/releases/download/apk-latest/shipment-checker.apk
# It is a debug-signed APK (fine for installing directly on a phone; not for the Play Store).
name: Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write          # to publish the APK on the release

jobs:
  build:
    runs-on: ubuntu-24.04            # pinned: ubuntu-latest moves to a new image
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build
        run: gradle -p android assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk shipment-checker.apk

      - uses: actions/upload-artifact@v6
        with:
          name: shipment-checker-apk
          path: shipment-checker.apk

      - name: Publish on the apk-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view apk-latest >/dev/null 2>&1; then
            gh release create apk-latest --title "Android app (latest build)" \
              --notes "Shipment pre-flight checker for Android. It opens the live app full-screen. Download shipment-checker.apk below, open it on your phone and allow installing from this source when asked."
          fi
          gh release upload apk-latest shipment-checker.apk --clobber
